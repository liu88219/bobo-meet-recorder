<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <filter id="crayon" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.9" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#DDD9CE" />
  <g filter="url(#crayon)" transform="translate(64, 66)">
