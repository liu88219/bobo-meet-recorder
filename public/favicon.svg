      fill="#C99661"
    />
    <circle cx="-8.5" cy="-12" r="3.5" fill="#171210" />
    <circle cx="8.5" cy="-12" r="3.5" fill="#171210" />
    <ellipse cx="0" cy="3" rx="8.2" ry="9.5" fill="#171210" />
    <!-- Mini butter-yellow cassette recorder held by tiny black paws -->
    <rect x="-20" y="18" width="40" height="24" rx="5" fill="#F2CA62" />
    <rect x="-12" y="25" width="24" height="9" rx="4.5" fill="#1E3158" />
    <circle cx="-6" cy="29.5" r="2.2" fill="#FAF8F3" />
    <circle cx="6" cy="29.5" r="2.2" fill="#FAF8F3" />
    <circle cx="14" cy="22.5" r="2.6" fill="#C83D33" />
